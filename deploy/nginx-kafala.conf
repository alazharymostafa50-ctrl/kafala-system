# Nginx أمام التطبيق مع HTTPS (استخدم certbot لإصدار الشهادة)
server {
    listen 80;
    server_name kafala.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name kafala.example.org;
    ssl_certificate     /etc/letsencrypt/live/kafala.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafala.example.org/privkey.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
