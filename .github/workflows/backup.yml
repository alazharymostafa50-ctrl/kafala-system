# نسخة احتياطية يومية مشفرة لقاعدة البيانات (تشمل المستندات والتقارير المحفوظة)
# تُحفظ كملف مرفق بتشغيل GitHub Actions لمدة 90 يومًا في هذا المستودع الخاص.
# المطلوب: أسرار المستودع BACKUP_DATABASE_URL (رابط Neon المباشر غير المجمّع) و BACKUP_KEY.
name: daily-backup
on:
  schedule:
    - cron: '30 23 * * *'   # 02:30 بتوقيت الرياض تقريبًا
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev --ignore-scripts
      - name: PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
      - name: Backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          STORAGE_DIR: ./storage
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_KEY" ]; then echo "أسرار النسخ الاحتياطي غير مضبوطة بعد"; exit 0; fi
          node scripts/backup.js --out backups
      - uses: actions/upload-artifact@v4
        with:
          name: kafala-backup-${{ github.run_number }}
          path: backups/*.kbak
          retention-days: 90
          if-no-files-found: ignore
